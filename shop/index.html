<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TK Services Shop</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#151515;--gold:#d8aa54;--gold2:#f2ca79;--text:#f7edda;--muted:#9f988d;--line:#3f3422;--good:#c8b06a}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at top,#18130b 0,#080808 32%,#080808 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}.shell{width:min(100%,980px);margin:0 auto;padding:env(safe-area-inset-top) 14px calc(26px + env(safe-area-inset-bottom))}.hero{padding:22px 2px 14px;display:flex;align-items:center;gap:13px}.mark{width:54px;height:54px;flex:0 0 54px;border:1px solid #7a5b29;border-radius:17px;background:linear-gradient(145deg,#1d160b,#0d0d0d);display:grid;place-items:center;color:var(--gold2);font-weight:950;letter-spacing:.6px;box-shadow:0 9px 30px #0008}.hero h1{font-size:22px;line-height:1.08;margin:0 0 4px;font-weight:900}.hero p{margin:0;color:var(--muted);font-size:12px}.updated{margin-top:4px;color:#746d62;font-size:10px}.searchWrap{position:sticky;top:0;z-index:10;padding:8px 0 8px;background:linear-gradient(#080808f5,#080808e8 78%,transparent);backdrop-filter:blur(12px)}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;background:#111;color:#fff;padding:0 15px;font-size:16px;outline:none;box-shadow:0 8px 24px #0005}.search::placeholder{color:#716b63}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{min-height:40px;border:1px solid var(--line);border-radius:999px;background:#101010;color:#d3c5aa;padding:0 14px;font-weight:700;font-size:13px;white-space:nowrap}.tab.on{background:var(--gold2);border-color:var(--gold2);color:#17120a}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 15px}.stat{padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#15130f,#0f0f0f)}.stat b{display:block;color:var(--gold2);font-size:22px;line-height:1}.stat span{display:block;margin-top:5px;font-size:10px;color:var(--muted)}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 9px}.sectionTitle b{font-size:14px}.sectionTitle span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr;gap:9px}.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 15px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#151515,#0d0d0d);box-shadow:0 8px 24px #0004}.info{min-width:0}.name{font-weight:850;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.pill{font-size:10px;color:#b6aa98;border:1px solid #332b20;border-radius:999px;padding:4px 7px;background:#0d0d0d}.stock{flex:0 0 auto;min-width:70px;text-align:right}.stock strong{display:block;font-size:24px;color:var(--gold2);line-height:1}.stock span{display:block;margin-top:5px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.low{color:#cfba7c!important}.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:17px;color:var(--muted);background:#0e0e0e}.footer{text-align:center;color:#6e675d;font-size:10px;padding:22px 0 6px}.brand{color:#9a8050;font-weight:800}@media(min-width:680px){.shell{padding-left:22px;padding-right:22px}.summary{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}}
</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div class="mark">TK</div>
    <div>
      <h1>TK Services Shop</h1>
      <p>Browse what is currently available</p>
      <div class="updated" id="updated">Loading stock…</div>
    </div>
  </header>

  <div class="searchWrap">
    <input id="search" class="search" type="search" placeholder="Search the shop…" autocomplete="off">
    <nav class="tabs" aria-label="Categories">
      <button class="tab on" data-filter="All">All</button>
      <button class="tab" data-filter="Aftershave">Aftershaves</button>
      <button class="tab" data-filter="Perfume">Perfumes</button>
      <button class="tab" data-filter="Unisex">Unisex</button>
      <button class="tab" data-filter="General Item">General Items</button>
    </nav>
  </div>

  <section class="summary">
    <div class="stat"><b id="products">0</b><span>Products available</span></div>
    <div class="stat"><b id="units">0</b><span>Total units</span></div>
    <div class="stat"><b id="fragrances">0</b><span>Fragrance lines</span></div>
    <div class="stat"><b id="general">0</b><span>General item lines</span></div>
  </section>

  <div class="sectionTitle"><b>Available now</b><span id="shown"></span></div>
  <section id="grid" class="grid"></section>
  <footer class="footer"><span class="brand">TK Services</span> · Shop</footer>
</main>
<script>
let items=[],active='All';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){
  const q=$('search').value.trim().toLowerCase();
  const available=items.filter(x=>Number(x.qty)>0);
  const rows=available.filter(x=>(active==='All'||x.category===active)&&(!q||String(x.name).toLowerCase().includes(q)||String(x.category).toLowerCase().includes(q)));
  $('products').textContent=available.length;
  $('units').textContent=available.reduce((n,x)=>n+(Number(x.qty)||0),0);
  $('fragrances').textContent=available.filter(x=>x.category!=='General Item').length;
  $('general').textContent=available.filter(x=>x.category==='General Item').length;
  $('shown').textContent=rows.length+' item'+(rows.length===1?'':'s');
  $('grid').innerHTML=rows.length?rows.map(x=>{
    const qty=Number(x.qty)||0;
    return `<article class="card"><div class="info"><div class="name">${esc(x.name)}</div><div class="meta"><span class="pill">${esc(x.category)}</span>${x.ml?`<span class="pill">${Number(x.ml)}ml</span>`:''}${qty<=2?'<span class="pill">Low stock</span>':''}</div></div><div class="stock"><strong class="${qty<=2?'low':''}">${qty}</strong><span>available</span></div></article>`
  }).join(''):'<div class="empty">No matching items are available right now.</div>';
}
async function load(){
  try{
    const r=await fetch('public-stock.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error();
    const d=await r.json();
    items=Array.isArray(d.items)?d.items:[];
    $('updated').textContent=d.updatedAt?'Updated '+new Date(d.updatedAt).toLocaleString():'Stock connected';
    render();
  }catch{
    $('updated').textContent='Stock temporarily unavailable';
    $('grid').innerHTML='<div class="empty">Please try again shortly.</div>';
  }
}
$('search').addEventListener('input',render);
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{active=btn.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===btn));render()}));
load();setInterval(load,30000);
</script>
</body>
</html>
